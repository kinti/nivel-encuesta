<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🔍</text></svg>">
<title>Encuesta del aula · ¿de quién es esta palabra?</title>
<style>
  :root { --ink:#1a1a1a; --mut:#667; --bg:#f6f5f2; --card:#fff; --acc:#1a56db; --ok:#0a7d33; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Georgia,'Times New Roman',serif; background:var(--bg); color:var(--ink); line-height:1.55; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:1.3rem; margin:.2em 0 .4em; }
  .card { background:var(--card); border:1px solid #e2e0da; border-radius:10px; padding:16px; margin:12px 0; }
  .frag { font-size:1.05rem; border-left:3px solid #d8d5cc; padding-left:12px; margin:10px 0 14px; }
  .frag mark { background:rgba(26,86,219,.14); color:inherit; padding:0 .15rem; font-weight:bold; }
  .q { font-family:sans-serif; font-size:.95rem; font-weight:600; margin:10px 0 4px; }
  label.opt { display:block; background:#fafaf8; border:1px solid #e2e0da; border-radius:8px; padding:10px 12px; margin:6px 0; cursor:pointer; font-family:sans-serif; font-size:.92rem; }
  label.opt:has(input:checked) { border-color:var(--acc); background:#eef4ff; }
  input[type=radio] { margin-right:8px; }
  button { font-family:sans-serif; font-size:1rem; background:var(--acc); color:#fff; border:0; border-radius:8px; padding:12px 18px; cursor:pointer; width:100%; margin-top:12px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.sec { background:#fff; color:var(--acc); border:1px solid var(--acc); }
  .bar { height:6px; background:#e5e3dd; border-radius:3px; overflow:hidden; margin:10px 0; }
  .bar i { display:block; height:100%; background:var(--acc); }
  .prog { font-family:sans-serif; font-size:.8rem; color:var(--mut); text-align:center; }
  .badge { display:inline-block; background:#fff3cd; border:1px solid #e6d9a2; color:#6b5308; font-size:.78rem; padding:2px 8px; border-radius:999px; margin-bottom:8px; font-family:sans-serif; }
  select, textarea { width:100%; font-family:sans-serif; font-size:1rem; padding:10px; border:1px solid #cfcdba; border-radius:8px; margin:4px 0 10px; }
  textarea { height:90px; }
  .note { font-family:sans-serif; font-size:.8rem; color:var(--mut); }
  .old-link { text-align:center; font-family:sans-serif; font-size:.85rem; margin-top:2rem; }
  .old-link a { color:var(--acc); }
</style>
</head>
<body>
<main id="app"></main>
<p class="old-link">También está la <a href="larga.html">encuesta general de 27 textos</a> (para cualquier lector, no solo el aula).</p>
<script>
const PRACTICE = { id: "p0", tipo: "practica",
  frag: "«Estoy muy cansado de esta situación», <mark>dijo</mark> el alcalde a la salida del pleno." };
const ITEMS = [
  { id: "a1", frag: "El investigador asegura que el hallazgo es <mark>espectacular</mark> y presenta tres cifras del estudio publicado." },
  { id: "a2", frag: "El plan del «Grupo Leire» contra la jueza Biedma: ¿atentado o <mark>disparate</mark>? <span class='note'>(titular)</span>" },
  { id: "a3", frag: "Una física «<mark>totalmente inesperada</mark>» detrás del fenómeno. <span class='note'>(subtítulo de la pieza; más abajo, el investigador dice esa misma frase en una cita con su nombre)</span>" },
  { id: "a4", frag: "El auto judicial invoca el <mark>«habeas corpus»</mark> y el «Artículo 14» de la Constitución." },
  { id: "a5", frag: "La <mark>trama</mark> de Leire Díez llegó esta semana a los tribunales, según el auto del juez." },
  { id: "a6", frag: "«Estamos muy preocupados por la deriva del país», <mark>dijo</mark> el portavoz ayer por la tarde." },
];
const OPTS = ["Del medio, en su propia voz", "De alguien citado (el investigador, el juez, el portavoz, el documento…)", "No se puede saber / depende de más contexto"];
const app = document.getElementById("app");
const ALL = [PRACTICE, ...ITEMS];
let state = { perfil: "", respuestas: {}, started: Date.now() };

function intro(){
  app.innerHTML = `
  <div class="card">
    <h1>¿De quién es esta palabra?</h1>
    <p>Encuesta del aula para un instrumento que analiza cómo están escritas
    las noticias. Te enseñamos <b>6 fragmentos reales de prensa</b> (y uno de
    práctica) con una palabra marcada. Solo una pregunta por fragmento:
    si esa palabra es <b>del medio</b> o <b>de alguien citado</b>.</p>
    <p class="note">No hay respuestas buenas ni malas: vale tu lectura honesta.
    Dos minutos. Anónima: no se piden datos personales; tus respuestas van a
    un archivo privado del proyecto (TFG, medición de estructura informativa)
    solo con fines de investigación.</p>
    <label class="q">Tu perfil</label>
    <select id="perfil">
      <option value="">elige…</option>
      <option value="estudiante-periodismo">Estudiante de periodismo / comunicación</option>
      <option value="profesor">Profesor del aula</option>
      <option value="otro">Otro</option>
    </select>
    <button id="start">Empezar</button>
  </div>`;
  document.getElementById("start").onclick = () => {
    const p = document.getElementById("perfil").value;
    if (!p) { alert("Elige un perfil."); return; }
    state.perfil = p; show(0);
  };
}

function show(i){
  if (i >= ALL.length) return final();
  const it = ALL[i];
  app.innerHTML = `
  <div class="bar"><i style="width:${Math.round(100*i/ALL.length)}%"></i></div>
  <div class="prog">fragmento ${i+1} de ${ALL.length}</div>
  <div class="card">
    ${it.tipo === "practica" ? '<span class="badge">PRÁCTICA: ejemplo para coger el tono — no cuenta</span>' : ""}
    <p class="frag">${it.frag}</p>
    <div class="q">¿De quién es la palabra marcada?</div>
    ${OPTS.map((o,j)=>`<label class="opt"><input type="radio" name="respuesta" value="${j}"> ${o}</label>`).join("")}
    <button id="next" disabled>${i+1===ALL.length ? "Última pregunta →" : "Siguiente"}</button>
  </div>`;
  document.querySelectorAll('input[name=respuesta]').forEach(inp => {
    inp.onchange = () => {
      state.respuestas[it.id] = parseInt(inp.value);
      document.getElementById("next").disabled = false;
    };
  });
  document.getElementById("next").onclick = () => show(i+1);
}

function final(){
  const payload = {
    tipo: "aula-propiedad", version_encuesta: "0.1",
    perfil: state.perfil,
    empezada: new Date(state.started).toISOString(),
    respuestas: ALL.map(it => ({ id: it.id, tipo: it.tipo || "real", respuesta: state.respuestas[it.id] })),
  };
  app.innerHTML = `
  <div class="card">
    <div class="q">Última pregunta (opcional, libre):</div>
    <p class="note">¿Ves algo en esos fragmentos que una herramienta automática debería señalar — o NO debería señalar? Cuéntanoslo como te salga.</p>
    <textarea id="libre" placeholder="…"></textarea>
    <button id="done">Enviar mis respuestas</button>
    <p class="note" id="msg"></p>
    <button class="sec" id="dl">Descargar copia (.json)</button>
  </div>`;
  document.getElementById("done").onclick = async () => {
    payload.libre = document.getElementById("libre").value.trim();
    const msg = document.getElementById("msg");
    try {
      const r = await fetch("https://nivel.nomust.com/v1/encuesta", {
        method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload) });
      if (!r.ok) throw new Error(r.status);
      msg.style.color = "#0a7d33";
      msg.textContent = "Recibidas. Gracias: tu lectura es exactamente el dato que faltaba.";
      document.getElementById("done").disabled = true;
    } catch (e) { msg.textContent = "No se pudo enviar ahora: descarga la copia y pásanosla."; }
  };
  document.getElementById("dl").onclick = () => {
    const blob = new Blob([JSON.stringify(payload)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "aula-nivel.json"; a.click();
  };
}
intro();
</script>
</body>
</html>
